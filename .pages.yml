# Pages CMS -- the editing screen the board uses (https://app.pagescms.org).
#
# Every file below is read by mockups/content.py when the site is built. A save
# here commits to main; .github/workflows/pages.yml then rebuilds and publishes
# the site, which takes about two minutes. If a value cannot be used (a date
# that is not a date, a logo that is not an image, a {{TOKEN}} typed wrong), the
# build stops and the site stays as it was -- the error is on the repository's
# Actions tab.
#
# "Pages": every word, photo and outside link on the seven pages, one section
# of the form per section of the page, in page order. The layout itself stays
# in mockups/src/ -- the board edits what is in each spot, not where spots go.
# The page forms were generated from the pages (field names like paragraph_2
# are positions, not meanings) and the sources hold {{T:page.section.field}}
# where each one goes. Adding a spot to a page means adding the token there,
# the value in content/pages/<page>.json, and the field here.
#
# "Dates and lists": what changes every year, laid out as proper lists.

media:
- name: logos
  label: Sponsor logos
  input: content/media/sponsors
  output: /content/media/sponsors
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: flyers
  label: Flyers
  input: content/media/flyers
  output: /content/media/flyers
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: photos
  label: Photos
  input: content/media/photos
  output: /content/media/photos
  extensions:
  - jpg
  - jpeg
  - png
  - webp
