<script>
/* ---- real footage, layered over the drifting still ----
   The page supplies the clip in #film-src's data-video; this partial is the same
   on every page that has one. The still photograph stays underneath as the
   poster, so every failure path below just leaves the photograph in place. */
(function(){
  var tag=document.getElementById('film-src');
  if(!tag) return;
  var mq=window.matchMedia('(prefers-reduced-motion: reduce)');
  var conn=navigator.connection||{};
  /* Under 760px take the phone-sized copy -- 960x540 and about 750 KB against
     1280x720 and 2.5 MB. The width now chooses a file rather than deciding
     whether there is a file at all: a page that offers no small copy resolves
     to an empty string here, skips below, and keeps the still photograph, which
     is exactly what every page did before the small copies existed. */
  var uri=(window.innerWidth < 760 ? tag.getAttribute('data-video-sm')
                                   : tag.getAttribute('data-video')) || '';
  // Still skip real footage where it would be rude regardless of size:
  //  - the visitor asked their system to reduce motion
  //  - the browser reports data saving
  var skip = !uri || mq.matches || conn.saveData === true;
  if(skip) return;
  var url;
  if(uri.slice(0,5)==='data:'){
    /* Artifact build: the clip is inlined, because a published page may not
       fetch anything from another host. Decode it once and share the blob. */
    try{
      var b64=uri.slice(uri.indexOf(',')+1);
      var bin=atob(b64), len=bin.length, buf=new Uint8Array(len);
      for(var i=0;i<len;i++) buf[i]=bin.charCodeAt(i);
      url=URL.createObjectURL(new Blob([buf],{type:'video/mp4'}));
    }catch(e){ return; }             // any failure: keep the still photograph
  }else{
    /* Site build: an ordinary file. Hand the browser the URL and let it stream
       with byte ranges, rather than pulling megabytes of base64 through atob
       before a single frame can play. */
    url=uri;
  }
  document.querySelectorAll('.media[data-film]').forEach(function(m){
    var v=document.createElement('video');
    v.muted=true; v.defaultMuted=true; v.loop=true; v.autoplay=true;
    v.playsInline=true; v.setAttribute('playsinline','');
    v.setAttribute('aria-hidden','true');          // decorative; the page reads fine without it
    v.src=url;
    v.className='vid';
    m.appendChild(v);
    var p=v.play(); if(p&&p.catch) p.catch(function(){ v.remove(); });
    v.addEventListener('playing',function(){ v.classList.add('on'); },{once:true});
  });
  document.body.classList.add('has-video');
})();
</script>
