<script>
/* ---- the mobile menu ---- */
(function(){
  var bar=document.getElementById('topnav'), btn=document.getElementById('menubtn');
  if(!bar||!btn) return;
  btn.addEventListener('click',function(){
    var open=bar.classList.toggle('open');
    btn.setAttribute('aria-expanded', open?'true':'false');
  });
  /* a link inside the panel closes it again */
  bar.querySelectorAll('#navlist a').forEach(function(a){
    a.addEventListener('click',function(){
      bar.classList.remove('open'); btn.setAttribute('aria-expanded','false');
    });
  });
})();

/* ---- the bar over the hero ----
   .over-hero is added only while the fixed bar still sits on the moving picture.
   The filled state is the CSS default, so with no script the bar is legible
   rather than white-on-white. A page with no hero never gets the class. */
(function(){
  var bar=document.getElementById('topnav'), hero=document.querySelector('.act1');
  if(!bar||!hero) return;
  function onScroll(){
    var h=hero.getBoundingClientRect().bottom - bar.offsetHeight;
    bar.classList.toggle('over-hero', h > 0);
  }
  onScroll();
  addEventListener('scroll',onScroll,{passive:true});
  addEventListener('resize',onScroll);
})();

/* ---- reveal on scroll ---- */
(function(){
  var items=document.querySelectorAll('.rv');
  if(!items.length) return;
  if(!('IntersectionObserver' in window) ||
     matchMedia('(prefers-reduced-motion: reduce)').matches){
    items.forEach(function(el){ el.classList.add('in'); });
    return;
  }
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
  },{rootMargin:'0px 0px -8% 0px'});
  items.forEach(function(el){ io.observe(el); });
})();

/* ---- the motion toggle ----
   Starts paused under prefers-reduced-motion. A page with no moving picture
   simply has no button, and this does nothing. */
(function(){
  var btn=document.getElementById('mbtn');
  if(!btn) return;
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ document.body.classList.add('paused'); }
  function label(){
    var on=!document.body.classList.contains('paused');
    btn.textContent = on ? 'Motion on' : 'Motion off';
    btn.setAttribute('aria-pressed', on?'true':'false');
  }
  label();
  btn.addEventListener('click',function(){
    document.body.classList.toggle('paused');
    var paused=document.body.classList.contains('paused');
    document.querySelectorAll('video.vid').forEach(function(v){ paused ? v.pause() : v.play(); });
    label();
  });
})();

/* Zeffy forms size themselves. The form inside each frame posts its current
   height to this page every time it changes -- a new step, a question opening,
   the thank-you screen -- and we set the frame to match. This is the same
   message Zeffy's own zeffy-embed.js listens for (read 2026-11-04); we handle
   it here instead of loading their script, which would also restyle every
   form as a 600px white card. The form only sends these messages when its
   address carries embed-version=v2 and an embedId, which build.py adds.

   The height in .zeffy.json is now only the starting size, used until the
   first message arrives and kept for good if scripting is off.

   iPhones get disableExpressCheckout=true, as Zeffy's script does: it removes
   the Apple Pay button inside the frame, which Zeffy evidently does not trust
   to work there. Card payment is unaffected. */
(function(){
  var frames=[].slice.call(document.querySelectorAll('iframe.zeffy-frame'));
  if(!frames.length) return;
  if(/iPhone|iPod/.test(navigator.userAgent)){
    frames.forEach(function(f){
      ['src','data-src'].forEach(function(a){
        var v=f.getAttribute(a);
        if(v) f.setAttribute(a, v+'&disableExpressCheckout=true');
      });
    });
  }
  var smooth=!matchMedia('(prefers-reduced-motion: reduce)').matches;
  window.addEventListener('message',function(e){
    if(e.origin!=='https://www.zeffy.com') return;
    var d=e.data;
    if(!d||typeof d!=='object'||typeof d.type!=='string') return;
    var f=frames.filter(function(x){ return x.contentWindow===e.source; })[0];
    if(!f) return;
    if(d.type==='zeffy-embed:resized'){
      var h=Math.ceil(Number(d.height));
      if(h>0) f.style.height=h+'px';
    } else if(d.type==='zeffy-embed:step-changed'||d.type==='zeffy-embed:thank-you-page-shown'){
      /* a shorter next step can leave the reader scrolled past the form */
      f.scrollIntoView({behavior:smooth?'smooth':'auto',
        block:d.type==='zeffy-embed:step-changed'?'nearest':'start'});
    }
  });
})();
</script>
