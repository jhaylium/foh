<!-- Hugs from Henry Birthday Club. The form is the Zeffy campaign, embedded.
     Student name, birthday month, grade and teacher are Zeffy custom questions
     on that campaign, not fields here -- without them a donation cannot be
     credited to a child.

     The button that opens this is a real link to the donate page. The script
     below intercepts it only where <dialog> exists, so with no JS -- or on a
     browser without showModal -- the button still goes somewhere useful. Same
     rule the mobile nav follows: never put something behind a button that
     scripting has to build. -->
<dialog id="hugdlg" class="modal" aria-labelledby="hugttl">
  <div class="modal-in">
    <button type="button" class="modal-x" id="hug-close" aria-label="Close">&times;</button>
    <p class="tag red">Grades K&ndash;5 &middot; $25 per child</p>
    <h2 id="hugttl" style="margin-top:14px">Hugs from Henry Birthday Club</h2>

    <div style="margin-top:clamp(24px,3.4vw,34px)">{{ZEFFY_EMBED_HENRY}}</div>
  </div>
</dialog>

<script>
/* Upgrade the link into a dialog, but only where showModal exists -- otherwise
   the link keeps working and lands on the donate form. showModal gives the
   focus trap, Escape and the backdrop for free. */
(function(){
  var dlg=document.getElementById('hugdlg'), open=document.getElementById('hug-open');
  if(!dlg||!open||typeof dlg.showModal!=='function') return;

  /* Repoint the href at this section before wiring anything up. The Artifact
     host runs its own click listener in the CAPTURE phase: any <a> whose href
     is a different origin gets turned into a navigation of the whole top frame.
     Capture beats our listener on the element, so the host had already sent the
     page to the donate form before preventDefault below could run -- the dialog
     opened and the page left underneath it. A same-origin fragment is the one
     thing that listener ignores.

     The cross-origin href stays in the markup, so a reader with no scripting
     still gets a working link to the donate form. This line is the enhancement
     taking ownership of the control it can now drive. */
  open.setAttribute('href','#henry');

  /* The embedded form carries data-src, not src: a <dialog> that is shut is
     still in the document, and an iframe with a real src would fetch a
     payment form for every visitor who never opens this. Promote it once, on
     the first open. */
  function show(){
    var f=dlg.querySelector('iframe[data-src]');
    if(f){ f.src=f.dataset.src; f.removeAttribute('data-src'); }
    dlg.showModal();
  }

  open.addEventListener('click',function(e){ e.preventDefault(); show(); });
  ['hug-close','hug-cancel'].forEach(function(id){
    var b=document.getElementById(id);
    if(b) b.addEventListener('click',function(){ dlg.close(); });
  });
  /* a click on the backdrop lands on <dialog> itself, never on its contents */
  dlg.addEventListener('click',function(e){ if(e.target===dlg) dlg.close(); });
  dlg.addEventListener('close',function(){ open.focus(); });
})();
</script>
