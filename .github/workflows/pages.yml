# Builds the site and publishes it to GitHub Pages.
#
# Every push to main rebuilds site/ from mockups/src/ and content/ -- including
# the commits Pages CMS makes when a board member saves a change. site/ is not
# committed any more: the four clips the site plays are real files in
# mockups/video/, so a fresh checkout has everything the build needs.
#
# If the build fails (most likely a value typed into Pages CMS that it cannot
# use), nothing is published and the last good site stays up. The error names
# the file and the entry; it is on this run's page under the Actions tab.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]        # every push to main deploys; this repo exists to publish site/
  workflow_dispatch:        # lets you publish by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead of cancelling, so a run that is
# already uploading is allowed to finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pillow trims and shrinks uploaded sponsor logos and flyers.
      - run: pip install pillow
      - run: python3 mockups/build.py --site
      # enablement:true lets the first run switch Pages on by itself, using this
      # workflow's own token. Without it the run fails with "Get Pages site
      # failed" until somebody clicks Settings -> Pages -> Source: GitHub Actions.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
